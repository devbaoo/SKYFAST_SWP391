<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Airline Dashboard - News Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script th:src="@{/assets/js/plugin/webfont/webfont.min.js}"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: ["/assets/css/fonts.min.css"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/plugins.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/kaiadmin.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
</head>

<body>
    <!-- Import sidebar từ file sideBar.html -->
    <div class="d-flex flex-row">
        <nav class="sidebar p-3">
            <h4 class="text-center dashboard-title" style="color: #575962">Staff Management</h4>
            <ul class="nav flex-column" id="sidebar-links">
                <li class="nav-item">
                    <!-- Sử dụng th:href để tạo đường dẫn động tới /staff/ticketManagement -->
                    <a th:href="@{/staff/ticketManagement}" class="nav-link" data-page="ticketManagement">
                        <i class="fas fa-credit-card mr-2"></i>
                        Ticket Management
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/staff/flightManagement}" class="nav-link" data-page="flightManagement">
                        <i class="fas fa-list-alt mr-2"></i>
                        Plane Category Management
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/staff/bookingManagement}" class="nav-link" data-page="bookingManagement">
                        <i class="fas fa-calendar-alt mr-2"></i>
                        Booking Management
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/staff/promotionManagement}" class="nav-link" data-page="promotionManagement">
                        <i class="fas fa-tags mr-2"></i>
                        Promotion Management
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/staff/newsManagement}" class="nav-link active" data-page="newsManagement">
                        <i class="fas fa-newspaper mr-2"></i>
                        News Management
                    </a>
                </li>
            </ul>
        </nav>
        <!-- Phần nội dung chính -->
        <div class="container mt-4 main-content">
            <div class="content-container" style="width: 1545px;">
                <h2 class="text-dark fw-bold">News List</h2>
                <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal"
                    data-bs-target="#createNewsModal">
                    Create News
                </button>
                <!-- Filters -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" id="newsTitleFilter" class="form-control" placeholder="Search by News Title"
                            onkeyup="filterTable()" />
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="categoryFilter" class="form-control" placeholder="Search by Category"
                            onkeyup="filterTable()" />
                    </div>
                    <div class="col-md-4">
                        <select id="statusFilter" class="form-control" onchange="filterTable()">
                            <option value="">All Statuses</option>
                            <option value="ACTIVE">Active</option>
                            <option value="INACTIVE">Inactive</option>
                        </select>
                    </div>
                </div>
                <!-- News Table -->
                <table id="newsTable" class="table table-borderless align-middle mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Content</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="news : ${newsList}" th:class="${news.status == 'INACTIVE'} ? 'table-secondary'">
                            <td th:text="${news.id}"></td>
                            <td th:text="${news.title}"></td>
                            <td th:text="${news.content}"></td>
                            <td th:text="${news.category}"></td>
                            <td>
                                <span th:text="${news.status}"
                                    th:class="${news.status == 'ACTIVE'} ? 'badge bg-success' : 'badge bg-danger'">
                                </span>
                            </td>
                            <td>
                                <a th:href="@{'/staff/newsManagement/' + ${news.id}}"
                                    class="btn btn-sm btn-primary me-1">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{'/staff/newsManagement/delete/' + ${news.id}}" method="post"
                                    style="display: inline;" th:if="${news.status != 'INACTIVE'}"
                                    onsubmit="return confirm('Are you sure you want to deactivate this news?');">
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal fade" id="createNewsModal" tabindex="-1" aria-labelledby="createNewsModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createNewsModalLabel">Create New News</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/staff/newsManagement/new}" method="post" th:object="${newNews}">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" required>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea class="form-control" id="content" th:field="*{content}" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" th:field="*{category}" required>
                        </div>
                        <div class="mb-3">
                            <label for="image" class="form-label">Image URL</label>
                            <input type="text" class="form-control" id="image" th:field="*{image}" required>
                        </div>
                        <div class="mb-3">
                            <label for="airlineId" class="form-label">Airline ID</label>
                            <input type="number" class="form-control" id="airlineId" th:field="*{airlineId}" required>
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Create News</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        function filterTable() {
            const titleFilter = document.getElementById('newsTitleFilter').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            const rows = document.querySelectorAll('#newsTable tbody tr');

            rows.forEach(row => {
                const title = row.cells[1].textContent.toLowerCase();
                const category = row.cells[3].textContent.toLowerCase();
                const status = row.cells[4].textContent.trim();

                const matchesTitle = title.includes(titleFilter);
                const matchesCategory = category.includes(categoryFilter);
                const matchesStatus = !statusFilter || status === statusFilter;

                row.style.display = matchesTitle && matchesCategory && matchesStatus ? '' : 'none';
            });
        }
    </script>
</body>

</html>
