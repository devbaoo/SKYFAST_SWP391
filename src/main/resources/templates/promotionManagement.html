<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Airline Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../assets/js/plugin/webfont/webfont.min.js"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: ["../assets/css/fonts.min.css"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });



    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/plugins.min.css" />
    <link rel="stylesheet" href="../assets/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="../assets/css/demo.css" />
    <script>
        let allPromotions = []; // Store all promotions for filtering

        async function fetchPromotions() {
            try {
                const response = await fetch('http://localhost:8080/promotions');
                if (!response.ok) throw new Error('Failed to fetch promotions');
                const promotions = await response.json();
                console.log('Fetched promotions:', promotions);
                allPromotions = promotions; // Store promotions for filtering
                renderPromotions(promotions);
            } catch (error) {
                console.error('Error fetching promotions:', error);
                throw error; // Re-throw to be caught in createPromotion
            }
        }

        function renderPromotions(promotions) {
            const tableBody = document.getElementById('promotionTableBody');
            tableBody.innerHTML = '';

            promotions.forEach(promotion => {
                const actionButtons = `
                <a href="promotionDetail.html?id=${promotion.id}" class="btn btn-sm btn-primary me-1">
                <i class="fas fa-edit"></i>
            </a>
                <button class="btn btn-sm btn-danger" onclick="softDeletePromotion(${promotion.id})" ${promotion.statusPromotion === 'INACTIVE' ? 'disabled' : ''}>
                    <i class="fas fa-trash"></i>
                </button>
            `;

                const row = `
                <tr class="${promotion.statusPromotion === 'INACTIVE' ? 'table-secondary' : ''}">
                    <td>${promotion.id}</td>
                    <td>${promotion.code}</td>
                    <td>${promotion.description}</td>
                    <td>${promotion.discountPercentage}</td>
                    <td>${formatDate(promotion.startDate)}</td>
                    <td>${formatDate(promotion.endDate)}</td>
                    <td>
                        <span class="badge ${promotion.status === 'Active' ? 'bg-success' : 'bg-danger'}">
                            ${promotion.status}
                        </span>
                    </td>
                    <td>
                        <span class="badge ${promotion.statusPromotion === 'ACTIVE' ? 'bg-success' : 'bg-danger'}">
                            ${promotion.statusPromotion}
                        </span>
                    </td>
                    <td>
                        ${actionButtons}
                    </td>
                </tr>
            `;
                tableBody.innerHTML += row;
            });
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function filterPromotions() {
            const codeFilter = document.getElementById('promotionCodeFilter').value.toLowerCase();
            const startDateFilter = document.getElementById('startDateFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filteredPromotions = allPromotions.filter(promotion => {
                const matchesCode = promotion.code.toLowerCase().includes(codeFilter);
                const matchesStartDate = startDateFilter ? promotion.startDate === startDateFilter : true;
                const matchesStatus = statusFilter ? promotion.statusPromotion === statusFilter : true;

                return matchesCode && matchesStartDate && matchesStatus;
            });

            renderPromotions(filteredPromotions);
        }

        async function createPromotion() {
            const newPromotionData = {
                code: document.getElementById('newPromotionCode').value,
                description: document.getElementById('newDescription').value,
                discountPercentage: parseInt(document.getElementById('newDiscountPercentage').value),
                startDate: document.getElementById('newStartDate').value,
                endDate: document.getElementById('newEndDate').value,
                image: document.getElementById('newImage').value,
                airlineId: parseInt(document.getElementById('newAirlineId').value),
                status: document.getElementById('newStatus').value,
                statusPromotion: document.getElementById('newStatusPromotion').value
            };

            try {
                const response = await fetch('http://localhost:8080/promotions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newPromotionData)
                });

                if (!response.ok) {
                    const errorMessage = await response.text();
                    throw new Error(`Failed to create promotion: ${errorMessage}`);
                }

                const createdPromotion = await response.json();
                console.log('Created promotion:', createdPromotion);

                alert('Promotion created successfully!');
                document.getElementById('createPromotionForm').reset();
                const modal = bootstrap.Modal.getInstance(document.getElementById('createPromotionModal'));
                modal.hide();

                // Refresh the list of promotions
                await fetchPromotions();
            } catch (error) {
                console.error('Error creating promotion:', error);
                alert(`Failed to create promotion: ${error.message}`);
            }
        }
        async function softDeletePromotion(id) {
            try {
                const response = await fetch(`http://localhost:8080/promotions/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to delete promotion');
                alert('Promotion deleted successfully');
                fetchPromotions(); // Refresh the list
            } catch (error) {
                console.error('Error deleting promotion:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchPromotions);
    </script>
</head>

<body>
<!-- Import sidebar từ file sideBar.html -->
<div class="d-flex flex-row">
    <nav class="sidebar p-3">
        <h4 class="text-center dashboard-title" style="color: #575962">Staff Management</h4>
        <ul class="nav flex-column" id="sidebar-links">
            <li class="nav-item">
                <a href="ticketManagement.html" class="nav-link active" data-page="ticketManagement.html">
                    <i class="fas fa-credit-card mr-2"></i>
                    Ticket Management
                </a>
            </li>
            <li class="nav-item">
                <a href="flightManagement.html" class="nav-link" data-page="flightManagement.html">
                    <i class="fas fa-list-alt mr-2">
                    </i>
                    Plane Category Management
                </a>
            </li>
            <li class="nav-item">
                <a href="bookingManagement.html" class="nav-link" data-page="bookingManagement.html">
                    <i class="fas fa-calendar-alt mr-2"></i>
                    Booking Management
                </a>
            </li>
            <li class="nav-item">
                <a href="ticketManagement.html" class="nav-link" data-page="ticketManagement.html">
                    <i class="fas fa-file-alt mr-2">
                    </i>
                    Order Management
                </a>
            </li>
            <li class="nav-item">
                <a href="promotionManagement.html" class="nav-link" data-page="promotionManagement.html">
                    <i class="fas fa-tags mr-2">
                    </i>
                    Discount Management
                </a>
            </li>
            <li class="nav-item">
                <a href="newsManagement.html" class="nav-link" data-page="newsManagement.html">
                    <i class="fas fa-newspaper mr-2">
                    </i>
                    News Management
                </a>
            </li>
        </ul>
    </nav>
    <!-- Phần nội dung chính -->
    <div class="container mt-4 main-content">
        <div class="content-container" style="width: 1545px;">
            <h2 class="text-dark fw-bold">Promotion List</h2>
            <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#createPromotionModal">
                Create Promotion
            </button>
            <!-- Filters -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text" id="promotionCodeFilter" class="form-control" placeholder="Search by Promotion Code" oninput="filterPromotions()"/>
                </div>
                <div class="col-md-4">
                    <input type="date" id="startDateFilter" class="form-control" placeholder="Search by Start Date" oninput="filterPromotions()"/>
                </div>
                <div class="col-md-4">
                    <select id="statusFilter" class="form-control" onchange="filterPromotions()">
                        <option value="">All Statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
            </div>
            <!-- Promotion Table -->
            <table id="promotionTable" class="table table-borderless align-middle mt-3">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Description</th>
                    <th>Discount (%)</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Status</th>
                    <th>Status Promotion</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="promotionTableBody">
                <!-- Promotion rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>
<div class="modal fade" id="createPromotionModal" tabindex="-1" aria-labelledby="createPromotionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createPromotionModalLabel">Create New Promotion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="createPromotionForm">
                    <!-- Form fields for promotion details -->
                    <div class="mb-3">
                        <label for="newPromotionCode" class="form-label">Promotion Code</label>
                        <input type="text" class="form-control" id="newPromotionCode" required>
                    </div>
                    <div class="mb-3">
                        <label for="newDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="newDescription" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="newDiscountPercentage" class="form-label">Discount Percentage</label>
                        <input type="number" class="form-control" id="newDiscountPercentage" required>
                    </div>
                    <div class="mb-3">
                        <label for="newStartDate" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="newStartDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="newEndDate" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="newEndDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="newImage" class="form-label">Image URL</label>
                        <input type="text" class="form-control" id="newImage" required>
                    </div>
                    <div class="mb-3">
                        <label for="newAirlineId" class="form-label">Airline ID</label>
                        <input type="number" class="form-control" id="newAirlineId" required>
                    </div>
                    <div class="mb-3">
                        <label for="newStatus" class="form-label">Status</label>
                        <select class="form-select" id="newStatus">
                            <option value="Active">Active</option>
                            <option value="Expired">Expired</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="newStatusPromotion" class="form-label">Status Promotion</label>
                        <select class="form-select" id="newStatusPromotion">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="createPromotion()">Create Promotion</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>

</html>
