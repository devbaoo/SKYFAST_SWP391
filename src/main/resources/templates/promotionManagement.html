<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Airline Dashboard - Promotion Management</title>
    <!-- Bootstrap CSS and other CSS files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script th:src="@{/assets/js/plugin/webfont/webfont.min.js}"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: [/* Thêm Thymeleaf cho đúng đường dẫn */
                    /* "../assets/css/fonts.min.css" */
                    "/assets/css/fonts.min.css"
                ],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/plugins.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/kaiadmin.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
</head>

<body>
    <div class="d-flex flex-row">
        <!-- Sidebar -->
        <nav class="sidebar p-3">
            <h4 class="text-center dashboard-title" style="color: #575962">Staff Management</h4>
            <ul class="nav flex-column" id="sidebar-links">
                <li class="nav-item">
                    <!-- Sử dụng th:href để tạo đường dẫn động tới /staff/ticketManagement -->
                    <a th:href="@{/staff/ticketManagement}" class="nav-link active" data-page="ticketManagement">
                        <i class="fas fa-credit-card mr-2"></i>
                        Ticket Management
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/staff/bookingManagement}" class="nav-link" data-page="bookingManagement.html">
                        <i class="fas fa-calendar-alt mr-2"></i>
                        Booking Management
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/staff/promotionManagement}" class="nav-link active" data-page="promotionManagement">
                        <i class="fas fa-tags mr-2"></i>
                        Promotion Management
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/staff/newsManagement}" class="nav-link" data-page="newsManagement.html">
                        <i class="fas fa-newspaper mr-2"></i>
                        News Management
                    </a>
                </li>
            </ul>
        </nav>
        <!-- Main Content -->
        <div class="container mt-4 main-content">
            <div class="content-container">
                <h2 class="text-dark fw-bold">Promotion List</h2>
                <!-- Button trigger modal -->
                <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal"
                    data-bs-target="#createPromotionModal">
                    Create Promotion
                </button>
                <!-- Bảng hiển thị danh sách khuyến mãi -->
                <table id="promotionTable" class="table table-borderless align-middle mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Description</th>
                            <th>Discount (%)</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Status</th>
                            <th>Status Promotion</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="promotion : ${promotions}"
                            th:class="${promotion.statusPromotion == 'INACTIVE'} ? 'table-secondary'">
                            <td th:text="${promotion.id}"></td>
                            <td th:text="${promotion.code}"></td>
                            <td th:text="${promotion.description}"></td>
                            <td th:text="${promotion.discountPercentage}"></td>
                            <td th:text="${#temporals.format(promotion.startDate, 'dd MMMM yyyy')}"></td>
                            <td th:text="${#temporals.format(promotion.endDate, 'dd MMMM yyyy')}"></td>
                            <td>
                                <span th:text="${promotion.status}"
                                    th:class="${promotion.status == 'Active'} ? 'badge bg-success' : 'badge bg-danger'">
                                </span>
                            </td>
                            <td>
                                <span th:text="${promotion.statusPromotion}"
                                    th:class="${promotion.statusPromotion == 'ACTIVE'} ? 'badge bg-success' : 'badge bg-danger'">
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-primary me-1"
                                    th:onclick="'editPromotion(' + ${promotion.id} + ')'">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" th:if="${promotion.statusPromotion != 'INACTIVE'}"
                                    th:onclick="'deletePromotion(' + ${promotion.id} + ')'">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Promotion Modal -->
    <div class="modal fade" id="createPromotionModal" tabindex="-1" aria-labelledby="createPromotionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createPromotionModalLabel">Create New Promotion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createPromotionForm" th:action="@{/staff/promotionManagement/new}" method="post">
                        <div class="mb-3">
                            <label for="code" class="form-label">Promotion Code</label>
                            <input type="text" class="form-control" id="code" name="code" required />
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="discountPercentage" class="form-label">Discount Percentage</label>
                            <input type="number" class="form-control" id="discountPercentage" name="discountPercentage"
                                min="0" max="100" required />
                        </div>
                        <div class="mb-3">
                            <label for="image" class="form-label">Image URL</label>
                            <input type="text" class="form-control" id="image" name="image" required />
                        </div>
                        <div class="mb-3">
                            <label for="airlineId" class="form-label">Airline ID</label>
                            <input type="number" class="form-control" id="airlineId" name="airlineId" required />
                        </div>
                        <div class="mb-3">
                            <label for="startDate" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="startDate" name="startDate" required />
                        </div>
                        <div class="mb-3">
                            <label for="endDate" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="endDate" name="endDate" required />
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="Active">Active</option>
                                <option value="Expired">Expired</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="statusPromotion" class="form-label">Status Promotion</label>
                            <select class="form-select" id="statusPromotion" name="statusPromotion">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="submitCreateForm()">Create Promotion</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        async function submitCreateForm() {
            const form = document.getElementById('createPromotionForm');
            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new URLSearchParams(formData),
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });

                if (!response.ok) throw new Error('Failed to create promotion');

                alert('Promotion created successfully!');
                location.reload();
            } catch (error) {
                console.error('Error creating promotion:', error);
                alert('Failed to create promotion. Please try again.');
            }
        }

        async function editPromotion(id) {
            window.location.href = `/staff/promotionManagement/${id}`;
        }

        async function deletePromotion(id) {
            if (!confirm('Are you sure you want to deactivate this promotion?')) {
                return;
            }
            try {
                const response = await fetch(`/staff/promotionManagement/delete/${id}`, {
                    method: 'GET'
                });
                if (!response.ok) throw new Error('Failed to delete promotion');
                alert('Promotion deactivated successfully!');
                location.reload();
            } catch (error) {
                console.error('Error deactivating promotion:', error);
                alert('Failed to deactivate promotion. Please try again.');
            }
        }

        // Validate end date is after start date
        document.getElementById('startDate').addEventListener('change', function () {
            document.getElementById('endDate').min = this.value;
        });

        document.getElementById('endDate').addEventListener('change', function () {
            const startDate = document.getElementById('startDate').value;
            if (startDate && this.value < startDate) {
                alert('End date must be after start date');
                this.value = '';
            }
        });
    </script>
</body>

</html>
