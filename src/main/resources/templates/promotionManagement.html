<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Airline Dashboard - Promotion Management</title>
    <!-- Bootstrap CSS and other CSS files -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <script th:src="@{/assets/js/plugin/webfont/webfont.min.js}"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: [/* Thêm Thymeleaf cho đúng đường dẫn */
                    /* "../assets/css/fonts.min.css" */
                    "/assets/css/fonts.min.css"
                ],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/plugins.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/kaiadmin.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
</head>
<body>
<div class="d-flex flex-row">
    <!-- Sidebar -->
    <nav class="sidebar p-3">
        <h4 class="text-center dashboard-title" style="color: #575962">Staff Management</h4>
        <ul class="nav flex-column" id="sidebar-links">
            <li class="nav-item">
                <!-- Sử dụng th:href để tạo đường dẫn động tới /staff/ticketManagement -->
                <a th:href="@{/staff/ticketManagement}" class="nav-link active" data-page="ticketManagement">
                    <i class="fas fa-credit-card mr-2"></i>
                    Ticket Management
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/staff/flightManagement}" class="nav-link" data-page="flightManagement">
                    <i class="fas fa-list-alt mr-2"></i>
                    Plane Category Management
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/staff/bookingManagement}" class="nav-link" data-page="bookingManagement.html">
                    <i class="fas fa-calendar-alt mr-2"></i>
                    Booking Management
                </a>
            </li>
            <li class="nav-item">
                <a href="promotionManagement.html" class="nav-link" data-page="promotionManagement.html">
                    <i class="fas fa-tags mr-2"></i>
                    Promotion Management
                </a>
            </li>
            <li class="nav-item">
                <a href="newsManagement.html" class="nav-link" data-page="newsManagement.html">
                    <i class="fas fa-newspaper mr-2"></i>
                    News Management
                </a>
            </li>
        </ul>
    </nav>
    <!-- Main Content -->
    <div class="container mt-4 main-content">
        <div class="content-container">
            <h2 class="text-dark fw-bold">Promotion List</h2>
            <!-- Link tạo mới khuyến mãi -->
            <a href="/staff/promotionManagement/new" class="btn btn-success mb-3">
                Create Promotion
            </a>
            <!-- Bảng hiển thị danh sách khuyến mãi -->
            <table id="promotionTable" class="table table-borderless align-middle mt-3">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Description</th>
                    <th>Discount (%)</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Status</th>
                    <th>Status Promotion</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="promotion : ${promotions}"
                    th:class="${promotion.statusPromotion == 'INACTIVE'} ? 'table-secondary'">
                    <td th:text="${promotion.id}"></td>
                    <td th:text="${promotion.code}"></td>
                    <td th:text="${promotion.description}"></td>
                    <td th:text="${promotion.discountPercentage}"></td>
                    <td th:text="${#temporals.format(promotion.startDate, 'dd MMMM yyyy')}"></td>
                    <td th:text="${#temporals.format(promotion.endDate, 'dd MMMM yyyy')}"></td>
                    <td>
                  <span th:text="${promotion.status}"
                        th:class="${promotion.status == 'Active'} ? 'badge bg-success' : 'badge bg-danger'">
                  </span>
                    </td>
                    <td>
                  <span th:text="${promotion.statusPromotion}"
                        th:class="${promotion.statusPromotion == 'ACTIVE'} ? 'badge bg-success' : 'badge bg-danger'">
                  </span>
                    </td>
                    <td>
                        <a th:href="@{'/staff/promotionManagement/' + ${promotion.id}}"
                           class="btn btn-sm btn-primary me-1">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{'/staff/promotionManagement/delete/' + ${promotion.id}}"
                           class="btn btn-sm btn-danger"
                           th:if="${promotion.statusPromotion != 'INACTIVE'}">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
