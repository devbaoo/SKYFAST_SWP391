<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">Flight Ticket Dashboard - Ticket List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="../assets/js/plugin/webfont/webfont.min.js"></script>
    <script>
        WebFont.load({
            google: {families: ["Public Sans:300,400,500,600,700"]},
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: ["../assets/css/fonts.min.css"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });


    </script>

    <style>
        /* Mặc định màu chữ */
        .nav-link {
            color: #575962;
            transition: color 0.3s ease-in-out;
        }

        /* Khi hover vào chữ, đổi màu */
        .nav-link:hover {
            color: #007bff !important; /* Màu xanh dương khi hover */
        }

        /* Giữ nguyên màu icon, không bị ảnh hưởng */
        .nav-link:hover i {
            color: inherit;
        }


    </style>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="../assets/css/plugins.min.css"/>
    <link rel="stylesheet" href="../assets/css/kaiadmin.min.css"/>

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="../assets/css/demo.css"/>
    <script>
        let allBookings = []; // Store all bookings for filtering

        async function fetchBookings() {
            try {
                const response = await fetch('http://localhost:8080/bookings');
                if (!response.ok) throw new Error('Failed to fetch bookings');
                const bookings = await response.json();
                console.log('Fetched bookings:', bookings); // Log the fetched data
                allBookings = bookings; // Store the fetched bookings
                renderBookings(bookings);
            } catch (error) {
                console.error('Error fetching bookings:', error);
            }
        }

        function renderBookings(bookingsList) {
            const tableBody = document.getElementById('bookingTableBody');
            tableBody.innerHTML = '';

            bookingsList.forEach(booking => {
                const actionButtons = `
                <button class="btn btn-sm btn-primary me-1" onclick="updateBooking(${booking.id})">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-danger" onclick="softDeleteBooking(${booking.id})" ${booking.status === 'INACTIVE' ? 'disabled' : ''}>
                    <i class="fas fa-trash"></i>
                </button>
                <button class="btn btn-sm btn-info" onclick="viewTickets(${booking.id}) ${booking.status === 'INACTIVE' ? 'disabled' : ''}">
                    <i class="fas fa-ticket-alt"></i> View Tickets
                </button>
            `;

                const row = `
                <tr class="${booking.status === 'INACTIVE' ? 'table-secondary' : ''}">
                    <td>${booking.id}</td>
                    <td>${booking.totalPrice}</td>
                    <td>${formatDate(booking.bookingDate)}</td>
                    <td>
                        <span class="badge ${booking.status === 'ACTIVE' ? 'bg-success' : 'bg-danger'}">
                            ${booking.status}
                        </span>
                    </td>
                    <td>
                        <span class="badge ${getBadgeClass(booking.bookingStatus)}">
                            ${booking.bookingStatus}
                        </span>
                    </td>
                    <td>
                        ${actionButtons}
                    </td>
                </tr>
            `;
                tableBody.innerHTML += row;
            });
        }

        function getBadgeClass(status) {
            switch (status.toUpperCase()) {
                case 'CONFIRMED':
                    return 'bg-success';
                case 'PENDING':
                    return 'bg-warning';
                case 'CANCELLED':
                    return 'bg-danger';
                default:
                    return 'bg-secondary';
            }
        }

        async function viewTickets(bookingId) {
            try {
                const response = await fetch(`http://localhost:8080/bookings/${bookingId}/tickets`);
                if (!response.ok) throw new Error('Failed to fetch tickets');
                const tickets = await response.json();
                console.log('Tickets for booking:', tickets);
                displayTickets(tickets);
            } catch (error) {
                console.error('Error fetching tickets:', error);
                alert('Failed to fetch tickets. Please try again.');
            }
        }

        function displayTickets(tickets) {
            const ticketsTableBody = document.getElementById('ticketsTableBody');
            ticketsTableBody.innerHTML = ''; // Clear previous content

            tickets.forEach(ticket => {
                const row = `
                <tr>
                    <td>${ticket.id}</td>
                    <td>${ticket.status}</td>
                    <td>${ticket.ticketPrice}</td>
                    <td>${ticket.seatId}</td>
                    <td>${ticket.flightId}</td>
                    <td>${ticket.passengerId}</td>
                </tr>
            `;
                ticketsTableBody.innerHTML += row;
            });

            // Show the modal
            const ticketsModal = new bootstrap.Modal(document.getElementById('ticketsModal'));
            ticketsModal.show();
        }

        async function updateBooking(bookingId) {
            // Find the booking and toggle its status
            const booking = allBookings.find(b => b.id === bookingId);
            const newStatus = booking.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';

            try {
                const response = await fetch(`http://localhost:8080/bookings/${bookingId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) throw new Error('Failed to update booking status');
                alert('Booking status updated successfully!');
                fetchBookings(); // Refresh the list to reflect changes
            } catch (error) {
                console.error('Error updating booking status:', error);
                alert('Failed to update booking status. Please try again.');
            }
        }

        async function softDeleteBooking(bookingId) {
            try {
                const response = await fetch(`http://localhost:8080/bookings/${bookingId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete booking');
                alert('Booking deleted successfully!');
                fetchBookings(); // Refresh the list to reflect changes
            } catch (error) {
                console.error('Error deleting booking:', error);
                alert('Failed to delete booking. Please try again.');
            }
        }

        function formatDate(dateString) {
            const options = {year: 'numeric', month: 'long', day: 'numeric'};
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function filterBookings() {
            const bookingFilter = document.getElementById('bookingFilter').value.toLowerCase();
            const dateFilter = document.getElementById('dateFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filteredBookings = allBookings.filter(booking => {
                const matchesBookingId = booking.id.toString().includes(bookingFilter);

                const matchesDate = dateFilter ? booking.bookingDate === dateFilter : true;

                const matchesStatus = statusFilter ? booking.status === statusFilter : true;

                return matchesBookingId && matchesDate && matchesStatus;
            });

            renderBookings(filteredBookings);
        }

        document.addEventListener('DOMContentLoaded', fetchBookings);
    </script>
</head>

<body>
<!-- Import sidebar từ file sideBar.html -->
<div class="d-flex flex-row">
    <nav class="sidebar p-3">
        <h4 class="text-center dashboard-title" style="color: #575962">Staff Management</h4>
        <ul class="nav flex-column" id="sidebar-links">
            <li class="nav-item">
                <a href="ticketManagement.html" class="nav-link active" data-page="ticketManagement.html">
                    <i class="fas fa-credit-card mr-2"></i>
                    Ticket Management
                </a>
            </li>
            <li class="nav-item">
                <a href="flightManagement.html" class="nav-link" data-page="flightManagement.html">
                    <i class="fas fa-list-alt mr-2">
                    </i>
                    Plane Category Management
                </a>
            </li>
            <li class="nav-item">
                <a href="bookingManagement.html" class="nav-link" data-page="bookingManagement.html">
                    <i class="fas fa-calendar-alt mr-2"></i>
                    Booking Management
                </a>
            </li>
            <li class="nav-item">
                <a href="ticketManagement.html" class="nav-link" data-page="ticketManagement.html">
                    <i class="fas fa-file-alt mr-2">
                    </i>
                    Order Management
                </a>
            </li>
            <li class="nav-item">
                <a href="promotionManagement.html" class="nav-link" data-page="promotionManagement.html">
                    <i class="fas fa-tags mr-2">
                    </i>
                    Discount Management
                </a>
            </li>
            <li class="nav-item">
                <a href="newsManagement.html" class="nav-link" data-page="newsManagement.html">
                    <i class="fas fa-newspaper mr-2">
                    </i>
                    News Management
                </a>
            </li>
        </ul>
    </nav>
    <!-- Phần nội dung chính -->
    <div class="container mt-4 main-content">
        <div class="content-container" style="width: 1545px;">
            <h2 class="text-dark fw-bold" th:text="${ticketListHeader}">Ticket List</h2>
            <!-- Bộ lọc -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text" id="bookingFilter" class="form-control" placeholder="Search by Booking ID"
                           oninput="filterBookings()"/>
                </div>
                <div class="col-md-4">
                    <input type="date" id="dateFilter" class="form-control" placeholder="Search by Booking Date"
                           oninput="filterBookings()"/>
                </div>
                <div class="col-md-4">
                    <select id="statusFilter" class="form-control" onchange="filterBookings()">
                        <option value="">All Statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
            </div>
            <!-- Bảng Ticket -->
            <table id="bookingTable" class="table table-borderless align-middle mt-3">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Total Price</th>
                    <th>Booking Date</th>
                    <th>Status</th>
                    <th>Booking Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="bookingTableBody">
                <!-- Booking rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    <!-- Modal for displaying tickets -->
    <div class="modal fade" id="ticketsModal" tabindex="-1" aria-labelledby="ticketsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ticketsModalLabel">Tickets for Booking</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Status</th>
                            <th>Price</th>
                            <th>Seat ID</th>
                            <th>Flight ID</th>
                            <th>Passenger ID</th>
                        </tr>
                        </thead>
                        <tbody id="ticketsTableBody">
                        <!-- Ticket rows will be inserted here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>

</html>
