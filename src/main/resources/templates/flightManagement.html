<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Flight Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="../assets/js/plugin/webfont/webfont.min.js"></script>
    <script>
        WebFont.load({
            google: {families: ["Public Sans:300,400,500,600,700"]},
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: ["../assets/css/fonts.min.css"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="../assets/css/plugins.min.css"/>
    <link rel="stylesheet" href="../assets/css/kaiadmin.min.css"/>
    <link rel="stylesheet" href="../assets/css/demo.css"/>

    <script>
        let allFlights = [];
        let airlines = [];
        let airplanes = [];
        let routes = [];

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', function () {
            loadFlights();
            loadAirlines();
            loadAirplanes();
            loadRoutes();
        });

        function loadFlights() {
            fetch('http://localhost:8080/api/flights')
                .then(response => response.json())
                .then(flights => {
                    allFlights = flights;
                    renderFlights(flights);
                })
                .catch(error => console.error('Error:', error));
        }

        function loadAirlines() {
            fetch('http://localhost:8080/api/airlines')
                .then(response => response.json())
                .then(data => {
                    airlines = data;
                    const select = document.getElementById('airlineId');
                    data.forEach(airline => {
                        select.innerHTML += `<option value="${airline.id}">${airline.airlineName}</option>`;
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function loadAirplanes() {
            fetch('http://localhost:8080/api/airplanes')
                .then(response => response.json())
                .then(data => {
                    airplanes = data;
                    const select = document.getElementById('airplaneId');
                    data.forEach(airplane => {
                        select.innerHTML += `<option value="${airplane.id}">${airplane.airplaneName}</option>`;
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function loadRoutes() {
            fetch('http://localhost:8080/api/routes')
                .then(response => response.json())
                .then(data => {
                    routes = data;
                    const select = document.getElementById('routeId');
                    data.forEach(route => {
                        select.innerHTML += `<option value="${route.id}">
                            ${route.departureAirportId} -> ${route.arrivalAirportId}
                        </option>`;
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function renderFlights(flights) {
            const tableBody = document.getElementById('flightTableBody');
            tableBody.innerHTML = '';

            flights.forEach(flight => {
                const actionButtons = flight.statusFlight === 'ACTIVE' ? `
                    <a href="flightDetail.html?id=${flight.id}" class="btn btn-sm btn-primary me-1">
                        <i class="fas fa-edit"></i>
                     </a>
                    <button class="btn btn-sm btn-danger" onclick="deleteFlight(${flight.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                ` : `
                    <button class="btn btn-sm btn-secondary" disabled>
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-secondary" disabled>
                        <i class="fas fa-trash"></i>
                    </button>
                `;

                const row = `
                    <tr class="${flight.statusFlight === 'INACTIVE' ? 'table-secondary' : ''}">
                        <td>${flight.flightNumber}</td>
                        <td>${formatDateTime(flight.departureTime)}</td>
                        <td>${formatDateTime(flight.arrivalTime)}</td>
                        <td>${flight.duration} mins</td>
                        <td>
                            <span class="badge ${getBadgeClass(flight.status)}">
                                ${flight.status}
                            </span>
                        </td>
                        <td>${flight.airlineId}</td>
                        <td>${flight.airplaneId}</td>
                        <td>${flight.routeId}</td>
                        <td>${actionButtons}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        function getBadgeClass(status) {
            switch (status) {
                case 'SCHEDULED':
                    return 'bg-primary';
                case 'DELAYED':
                    return 'bg-warning';
                case 'BOARDING':
                    return 'bg-info';
                case 'IN_FLIGHT':
                    return 'bg-success';
                case 'LANDED':
                    return 'bg-secondary';
                case 'CANCELLED':
                    return 'bg-danger';
                default:
                    return 'bg-secondary';
            }
        }

        function formatDateTime(dateTimeString) {
            return new Date(dateTimeString).toLocaleString();
        }

        function saveFlight() {
            const flightId = document.getElementById('flightId').value;
            const flight = {
                flightNumber: document.getElementById('flightNumber').value,
                departureTime: document.getElementById('departureTime').value,
                arrivalTime: document.getElementById('arrivalTime').value,
                duration: parseInt(document.getElementById('duration').value),
                status: document.getElementById('status').value,
                airlineId: parseInt(document.getElementById('airlineId').value),
                airplaneId: parseInt(document.getElementById('airplaneId').value),
                routeId: parseInt(document.getElementById('routeId').value)
            };

            const url = flightId ?
                `http://localhost:8080/api/flights/${flightId}` :
                'http://localhost:8080/api/flights';
            const method = flightId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(flight)
            })
                .then(response => response.json())
                .then(() => {
                    loadFlights();
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addFlightModal'));
                    modal.hide();
                })
                .catch(error => console.error('Error:', error));
        }

        function editFlight(flight) {
            document.getElementById('flightId').value = flight.id;
            document.getElementById('flightNumber').value = flight.flightNumber;
            document.getElementById('departureTime').value = flight.departureTime.slice(0, 16);
            document.getElementById('arrivalTime').value = flight.arrivalTime.slice(0, 16);
            document.getElementById('duration').value = flight.duration;
            document.getElementById('status').value = flight.status;
            document.getElementById('airlineId').value = flight.airlineId;
            document.getElementById('airplaneId').value = flight.airplaneId;
            document.getElementById('routeId').value = flight.routeId;

            document.getElementById('modalTitle').textContent = 'Edit Flight';
            const modal = new bootstrap.Modal(document.getElementById('addFlightModal'));
            modal.show();
        }

        function deleteFlight(id) {
            if (confirm('Are you sure you want to delete this flight?')) {
                fetch(`http://localhost:8080/api/flights/${id}`, {
                    method: 'DELETE'
                })
                    .then(() => loadFlights())
                    .catch(error => console.error('Error:', error));
            }
        }

        function filterFlights() {
            const statusFilter = document.getElementById("statusFilter").value;
            const searchFilter = document.getElementById("searchFilter").value.toLowerCase();

            const filtered = allFlights.filter(flight => {
                const statusMatch = statusFilter === "" || flight.status === statusFilter;
                const searchMatch = searchFilter === "" ||
                    flight.flightNumber.toLowerCase().includes(searchFilter);

                return statusMatch && searchMatch;
            });

            renderFlights(filtered);
        }
    </script>
</head>

<body>
<div class="d-flex flex-row">
    <!-- Sidebar -->
    <nav class="sidebar p-3">
        <h4 class="text-center dashboard-title">SkyFast</h4>
        <ul class="nav flex-column" id="sidebar-links">
            <li class="nav-item">
                <a href="Dashboard.html" class="nav-link active" data-page="Dashboard.html">
                    <i class="fas fa-home"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="flightManagement.html" class="nav-link" data-page="flightManagement.html">
                    <i class="fas fa-plane"></i>Flight Management
                </a>
            </li>
            <li class="nav-item">
                <a href="airlineManagement.html" class="nav-link" data-page="airlineManagement.html">
                    <i class="fas fa-plane"></i>Airline Management
                </a>
            </li>
            <li class="nav-item">
                <a href="ticketManagement.html" class="nav-link" data-page="ticketManagement.html">
                    <i class="fas fa-ticket-alt"></i>Ticket Management
                </a>
            </li>
            <li class="nav-item">
                <a href="userlist.html" class="nav-link" data-page="userlist.html">
                    <i class="fas fa-users"></i>User Management
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4 main-content">
        <div class="content-container" style="width: 1545px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Flight Management</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addFlightModal">
                    <i class="fas fa-plus"></i> Add New Flight
                </button>
            </div>

            <!-- Filters -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-filter"></i>
                        </span>
                        <select id="statusFilter" class="form-select" onchange="filterFlights()">
                            <option value="">All Status</option>
                            <option value="SCHEDULED">SCHEDULED</option>
                            <option value="DELAYED">DELAYED</option>
                            <option value="BOARDING">BOARDING</option>
                            <option value="IN_FLIGHT">IN_FLIGHT</option>
                            <option value="LANDED">LANDED</option>
                            <option value="CANCELLED">CANCELLED</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchFilter" class="form-control"
                               placeholder="Search by Flight Number" oninput="filterFlights()"/>
                    </div>
                </div>
            </div>

            <!-- Flights Table -->
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Flight Number</th>
                    <th>Departure Time</th>
                    <th>Arrival Time</th>
                    <th>Duration (mins)</th>
                    <th>Status</th>
                    <th>Airline</th>
                    <th>Airplane</th>
                    <th>Route</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="flightTableBody">
                <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add/Edit Flight Modal -->
<div class="modal fade" id="addFlightModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add New Flight</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="flightForm">
                    <input type="hidden" id="flightId">
                    <div class="mb-3">
                        <label class="form-label">Flight Number</label>
                        <input type="text" class="form-control" id="flightNumber" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Departure Time</label>
                        <input type="datetime-local" class="form-control" id="departureTime" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Arrival Time</label>
                        <input type="datetime-local" class="form-control" id="arrivalTime" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Duration (minutes)</label>
                        <input type="number" class="form-control" id="duration" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="status" required>
                            <option value="SCHEDULED">SCHEDULED</option>
                            <option value="DELAYED">DELAYED</option>
                            <option value="BOARDING">BOARDING</option>
                            <option value="IN_FLIGHT">IN_FLIGHT</option>
                            <option value="LANDED">LANDED</option>
                            <option value="CANCELLED">CANCELLED</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Airline</label>
                        <select class="form-select" id="airlineId" required>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Airplane</label>
                        <select class="form-select" id="airplaneId" required>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Route</label>
                        <select class="form-select" id="routeId" required>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="saveFlight()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
