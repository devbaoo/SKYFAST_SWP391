                    "simple-line-icons",
                ],
                urls: ["../assets/css/fonts.min.css"],
            },
            active: function () {

        });


    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="../assets/css/plugins.min.css"/>

    <style>

<body>
<div id="layout">
    <!-- Sidebar sẽ được load vào đây -->

        <h4 class="text-center dashboard-title" style="color: #575962">Staff Management</h4>
        <ul class="nav flex-column" id="sidebar-links">

                <a href="ticketManagement.html" class="nav-link active" data-page="ticketManagement.html">

                </a>
            </li>
            <li class="nav-item">
                <a href="flightManagement.html" class="nav-link" data-page="flightManagement.html">
                    <i class="fas fa-list-alt mr-2">
                    </i>
                    Plane Category Management
                </a>
            </li>
            <li class="nav-item">
                <a href="bookingManagement.html" class="nav-link" data-page="bookingManagement.html">
                    <i class="fas fa-calendar-alt mr-2"></i>
                    Booking Management
                </a>
            </li>
            <li class="nav-item">

    <!-- Nội dung chính -->
    <div id="main-content">
        <div class="container mt-4">
            <h2 class="text-dark fw-bold">Edit Promotion</h2>
            <form id="promotionDetailForm">
                <div class="mb-3">
                    <label for="promotionCode" class="form-label">Promotion Code</label>
                    <input type="text" class="form-control" id="promotionCode">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description"></textarea>
                </div>
                <div class="mb-3">
                    <label for="discountPercentage" class="form-label">Discount Percentage</label>
                    <input type="number" class="form-control" id="discountPercentage">
                </div>
                <div class="mb-3">
                    <label for="image" class="form-label">Image</label>
                    <input type="text" class="form-control" id="image">
                </div>
                <div class="mb-3">
                    <label for="airlineId" class="form-label">Airline ID</label>
                    <input type="number" class="form-control" id="airlineId">
                </div>
                <div class="mb-3">
                    <label for="startDate" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="startDate">
                </div>
                <div class="mb-3">
                    <label for="endDate" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="endDate">
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status">
                        <option value="Active">Active</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="statusPromotion" class="form-label">Status Promotion</label>
                    <select class="form-select" id="statusPromotion">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                <button type="button" class="btn btn-primary" onclick="updatePromotion()">Save Changes</button>
                <a href="promotionManagement.html" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script>
    let promotionId;

    document.addEventListener('DOMContentLoaded', async () => {
        promotionId = getUrlParameter('id');
        if (promotionId) {
            try {
                const response = await fetch(`http://localhost:8080/promotions/${promotionId}`);
                if (!response.ok) throw new Error('Failed to fetch promotion data');
                const promotionData = await response.json();
                populateForm(promotionData);
            } catch (error) {
                console.error('Error fetching promotion data:', error);
                alert('Failed to load promotion data. Please try again.');
            }
        } else {
            alert('Promotion ID not provided. Redirecting to promotion list.');
            window.location.href = 'promotionManagement.html';
        }
    });

    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        const results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    function populateForm(promotionData) {
        document.getElementById('promotionCode').value = promotionData.code;
        document.getElementById('description').value = promotionData.description;
        document.getElementById('discountPercentage').value = promotionData.discountPercentage;
        document.getElementById('image').value = promotionData.image;
        document.getElementById('airlineId').value = promotionData.airlineId;
        document.getElementById('startDate').value = promotionData.startDate;
        document.getElementById('endDate').value = promotionData.endDate;
        document.getElementById('status').value = promotionData.status;
        document.getElementById('statusPromotion').value = promotionData.statusPromotion;
    }

    async function updatePromotion() {
        const updatedPromotionData = {
            code: document.getElementById('promotionCode').value,
            description: document.getElementById('description').value,
            discountPercentage: parseInt(document.getElementById('discountPercentage').value),
            image: parseInt(document.getElementById('image').value),
            airlineId: parseInt(document.getElementById('airlineId').value),
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value,
            status: document.getElementById('status').value,
            statusPromotion: document.getElementById('statusPromotion').value
        };

        try {
            const response = await fetch(`http://localhost:8080/promotions/${promotionId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedPromotionData)
            });

            if (!response.ok) throw new Error('Failed to update promotion data');
            alert('Promotion updated successfully!');
            window.location.href = 'promotionManagement.html';

        } catch (error) {
            console.error('Error updating promotion data:', error);
            alert('Failed to save changes. Please try again.');
        }
    }
</script>
</body>
</html>
