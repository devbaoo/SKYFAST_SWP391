<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Airline Dashboard - Edit Promotion</title>
    <!-- Bootstrap CSS and other CSS files -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <script th:src="@{/assets/js/plugin/webfont/webfont.min.js}"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: [/* Thêm Thymeleaf cho đúng đường dẫn */
                    /* "../assets/css/fonts.min.css" */
                    "/assets/css/fonts.min.css"
                ],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/plugins.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/kaiadmin.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
</head>
<body>
<div id="layout" style="display: flex;">
    <!-- Sidebar -->
    <nav class="sidebar p-3">
        <h4 class="text-center dashboard-title" style="color: #575962">
            Staff Management
        </h4>
        <ul class="nav flex-column" id="sidebar-links">
            <li class="nav-item">
                <a href="ticketManagement.html" class="nav-link" data-page="ticketManagement.html">
                    <i class="fas fa-credit-card mr-2"></i>
                    Ticket Management
                </a>
            </li>
            <li class="nav-item">
                <a href="flightManagement.html" class="nav-link" data-page="flightManagement.html">
                    <i class="fas fa-list-alt mr-2"></i>
                    Plane Category Management
                </a>
            </li>
            <li class="nav-item">
                <a href="bookingManagement.html" class="nav-link" data-page="bookingManagement.html">
                    <i class="fas fa-calendar-alt mr-2"></i>
                    Booking Management
                </a>
            </li>
            <li class="nav-item">
                <a href="ticketManagement.html" class="nav-link" data-page="ticketManagement.html">
                    <i class="fas fa-file-alt mr-2"></i>
                    Order Management
                </a>
            </li>
            <li class="nav-item">
                <a href="promotionManagement.html" class="nav-link active" data-page="promotionManagement.html">
                    <i class="fas fa-tags mr-2"></i>
                    Discount Management
                </a>
            </li>
            <li class="nav-item">
                <a href="newsManagement.html" class="nav-link" data-page="newsManagement.html">
                    <i class="fas fa-newspaper mr-2"></i>
                    News Management
                </a>
            </li>
        </ul>
    </nav>
    <!-- Main Content -->
    <div id="main-content" style="flex: 1; padding: 20px;">
        <div class="container mt-4">
            <h2 class="text-dark fw-bold">Edit Promotion</h2>
            <form th:action="@{'/staff/promotionManagement/edit/' + ${promotion.id}}"
                  th:object="${promotion}" method="post">
                <div class="mb-3">
                    <label for="code" class="form-label">Promotion Code</label>
                    <input type="text" class="form-control" id="code" th:field="*{code}" required />
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" th:field="*{description}" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="discountPercentage" class="form-label">Discount Percentage</label>
                    <input type="number" class="form-control" id="discountPercentage" th:field="*{discountPercentage}" required />
                </div>
                <div class="mb-3">
                    <label for="image" class="form-label">Image URL</label>
                    <input type="text" class="form-control" id="image" th:field="*{image}" required />
                </div>
                <div class="mb-3">
                    <label for="airlineId" class="form-label">Airline ID</label>
                    <input type="number" class="form-control" id="airlineId" th:field="*{airlineId}" required />
                </div>
                <div class="mb-3">
                    <label for="startDate" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="startDate" th:field="*{startDate}" required />
                </div>
                <div class="mb-3">
                    <label for="endDate" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="endDate" th:field="*{endDate}" required />
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option value="Active">Active</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="statusPromotion" class="form-label">Status Promotion</label>
                    <select class="form-select" id="statusPromotion" th:field="*{statusPromotion}">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/staff/promotionManagement" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
