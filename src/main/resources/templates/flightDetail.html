<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/js/plugin/webfont/webfont.min.js"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: ["../assets/css/fonts.min.css"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });


    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/plugins.min.css" />
    <link rel="stylesheet" href="../assets/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="../assets/css/demo.css" />
    <style>
        /* Bạn có thể thêm style cho layout chung ở đây */
        #layout {
            display: flex;
        }

        #sidebar-container {
            /* Điều chỉnh chiều rộng sidebar theo nhu cầu */
        }

        #main-content {
            flex: 1;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div id="layout">
        <!-- Sidebar sẽ được load vào đây -->
        <nav class="sidebar p-3">
            <h4 class="text-center dashboard-title" style="color: #575962">SkyFast</h4>
            <ul class="nav flex-column" id="sidebar-links">
                <li class="nav-item">
                    <a href="Dashboard.html" class="nav-link active" data-page="Dashboard.html">
                        <i class="fas fa-home"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="flightManagement.html" class="nav-link" data-page="flightManagement.html">
                        <i class="fas fa-plane"></i>Flight Management
                    </a>
                </li>
                <li class="nav-item">
                    <a href="airlineManagement.html" class="nav-link" data-page="airlineManagement.html">
                        <i class="fas fa-plane"></i>Airline Management
                    </a>
                </li>
                <li class="nav-item">
                    <a href="ticketManagement.html" class="nav-link" data-page="ticketManagement.html">
                        <i class="fas fa-ticket-alt"></i>Ticket Management
                    </a>
                </li>
                <li class="nav-item">
                    <a href="userlist.html" class="nav-link" data-page="userlist.html">
                        <i class="fas fa-users"></i>User Management
                    </a>
                </li>
            </ul>
        </nav>


        <!-- Nội dung chính -->
        <div id="main-content">
            <div class="container mt-4">
                <div class="content-container" style="width: 1545px;">
                    <div class="card shadow-lg p-4">
                        <h2 class="text-dark fw-bold">Flight Detail</h2>
                        <form id="flightDetailForm">
                            <div class="mb-3">
                                <label for="flightId" class="form-label">Flight ID</label>
                                <input type="text" class="form-control" id="flightId" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="flightNumber" class="form-label">Flight Number</label>
                                <input type="text" class="form-control" id="flightNumber" required>
                            </div>
                            <div class="mb-3">
                                <label for="departureTime" class="form-label">Departure Time</label>
                                <input type="datetime-local" class="form-control" id="departureTime" required>
                            </div>
                            <div class="mb-3">
                                <label for="arrivalTime" class="form-label">Arrival Time</label>
                                <input type="datetime-local" class="form-control" id="arrivalTime" required>
                            </div>
                            <div class="mb-3">
                                <label for="duration" class="form-label">Duration (minutes)</label>
                                <input type="number" class="form-control" id="duration" required>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" required>
                                    <option value="SCHEDULED">SCHEDULED</option>
                                    <option value="DELAYED">DELAYED</option>
                                    <option value="BOARDING">BOARDING</option>
                                    <option value="IN_FLIGHT">IN_FLIGHT</option>
                                    <option value="LANDED">LANDED</option>
                                    <option value="CANCELLED">CANCELLED</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="airlineId" class="form-label">Airline</label>
                                <select class="form-select" id="airlineId" required>
                                    <!-- Options will be populated dynamically -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="airplaneId" class="form-label">Airplane</label>
                                <select class="form-select" id="airplaneId" required>
                                    <!-- Options will be populated dynamically -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="routeId" class="form-label">Route</label>
                                <select class="form-select" id="routeId" required>
                                    <!-- Options will be populated dynamically -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <a href="flightManagement.html" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Back
                                </a>
                                <button type="button" class="btn btn-primary" onclick="saveChanges()">
                                    <i class="fas fa-save"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        let flightId;

        // Load all necessary data when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            await loadAirlines();
            await loadAirplanes();
            await loadRoutes();

            flightId = getUrlParameter('id');
            if (flightId) {
                try {
                    const response = await fetch(`http://localhost:8080/api/flights/${flightId}`);
                    if (!response.ok) {
                        throw new Error('Failed to fetch flight data');
                    }
                    const flightData = await response.json();
                    populateForm(flightData);
                } catch (error) {
                    console.error('Error fetching flight data:', error);
                    alert('Failed to load flight data. Please try again.');
                }
            } else {
                alert('Flight ID not provided. Redirecting to flight list.');
                window.location.href = 'flightManagement.html';
            }
        });

        async function loadAirlines() {
            try {
                const response = await fetch('http://localhost:8080/api/airlines');
                const airlines = await response.json();
                const select = document.getElementById('airlineId');
                airlines.forEach(airline => {
                    select.innerHTML += `<option value="${airline.id}">${airline.airlineName}</option>`;
                });
            } catch (error) {
                console.error('Error loading airlines:', error);
            }
        }

        async function loadAirplanes() {
            try {
                const response = await fetch('http://localhost:8080/api/airplanes');
                const airplanes = await response.json();
                const select = document.getElementById('airplaneId');
                airplanes.forEach(airplane => {
                    select.innerHTML += `<option value="${airplane.id}">${airplane.airplaneName}</option>`;
                });
            } catch (error) {
                console.error('Error loading airplanes:', error);
            }
        }

        async function loadRoutes() {
            try {
                const response = await fetch('http://localhost:8080/api/routes');
                const routes = await response.json();
                const select = document.getElementById('routeId');
                routes.forEach(route => {
                    select.innerHTML += `<option value="${route.id}">
                    ${route.departureAirportId} -> ${route.arrivalAirportId}
                </option>`;
                });
            } catch (error) {
                console.error('Error loading routes:', error);
            }
        }

        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        function populateForm(flightData) {
            document.getElementById('flightId').value = flightData.id;
            document.getElementById('flightNumber').value = flightData.flightNumber;
            document.getElementById('departureTime').value = flightData.departureTime.slice(0, 16);
            document.getElementById('arrivalTime').value = flightData.arrivalTime.slice(0, 16);
            document.getElementById('duration').value = flightData.duration;
            document.getElementById('status').value = flightData.status;
            document.getElementById('airlineId').value = flightData.airlineId;
            document.getElementById('airplaneId').value = flightData.airplaneId;
            document.getElementById('routeId').value = flightData.routeId;
        }

        async function saveChanges() {
            const updatedFlightData = {
                id: document.getElementById('flightId').value,
                flightNumber: document.getElementById('flightNumber').value,
                departureTime: document.getElementById('departureTime').value,
                arrivalTime: document.getElementById('arrivalTime').value,
                duration: parseInt(document.getElementById('duration').value),
                status: document.getElementById('status').value,
                airlineId: parseInt(document.getElementById('airlineId').value),
                airplaneId: parseInt(document.getElementById('airplaneId').value),
                routeId: parseInt(document.getElementById('routeId').value)
            };

            try {
                const response = await fetch(`http://localhost:8080/api/flights/${flightId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedFlightData)
                });

                if (!response.ok) {
                    throw new Error('Failed to update flight data');
                }

                alert('Changes saved successfully!');
                window.location.href = 'flightManagement.html';

            } catch (error) {
                console.error('Error updating flight data:', error);
                alert('Failed to save changes. Please try again.');
            }
        }
    </script>
</body>

</html>
