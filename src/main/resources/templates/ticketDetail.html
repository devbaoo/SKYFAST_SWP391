<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Ticket Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script th:src="@{/assets/js/plugin/webfont/webfont.min.js}"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: [/* Thêm Thymeleaf cho đúng đường dẫn */
                    /* "../assets/css/fonts.min.css" */
                    "/assets/css/fonts.min.css"
                ],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/plugins.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/kaiadmin.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
    <style>
        /* Custom styles */
        #layout {
            display: flex;
        }
        #main-content {
            flex: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
<div id="layout">
    <!-- Sidebar -->
    <nav class="sidebar p-3">
        <h4 class="text-center dashboard-title" style="color: #575962">Staff Management</h4>
        <ul class="nav flex-column" id="sidebar-links">
            <li class="nav-item">
                <!-- Sử dụng th:href để tạo đường dẫn động tới /staff/ticketManagement -->
                <a th:href="@{/staff/ticketManagement}" class="nav-link active" data-page="ticketManagement">
                    <i class="fas fa-credit-card mr-2"></i>
                    Ticket Management
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/staff/bookingManagement}" class="nav-link" data-page="bookingManagement.html">
                    <i class="fas fa-calendar-alt mr-2"></i>
                    Booking Management
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/staff/promotionManagement}" class="nav-link active" data-page="promotionManagement">
                    <i class="fas fa-tags mr-2"></i>
                    Promotion Management
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/staff/newsManagement}" class="nav-link" data-page="newsManagement.html">
                    <i class="fas fa-newspaper mr-2"></i>
                    News Management
                </a>
            </li>
        </ul>
    </nav>

    <!-- Nội dung chính -->
    <div id="main-content">
        <div class="container mt-4">
            <div class="card shadow-lg p-4">
                <h2 class="text-dark fw-bold" th:text="${ticketDetailHeader}">Ticket Detail</h2>
                <form th:action="@{/staff/ticketManagement/{id}(id=${ticketDTO.id})}" th:object="${ticketDTO}" method="post">
                    <!-- Ticket ID (readonly) -->
                    <div class="mb-3">
                        <label for="ticketId" class="form-label">Ticket ID</label>
                        <input type="text" class="form-control" id="ticketId" th:value="*{id}" readonly/>
                    </div>
                    <!-- Booking ID (readonly) -->
                    <div class="mb-3">
                        <label for="bookingId" class="form-label">Booking ID</label>
                        <input type="text" class="form-control" id="bookingId" th:value="*{bookingId}" readonly/>
                    </div>
                    <!-- Flight Number (readonly) -->
                    <div class="mb-3">
                        <label for="flightNumber" class="form-label">Flight Number</label>
                        <input type="text" class="form-control" id="flightNumber" th:value="*{flightNumber}" readonly/>
                    </div>
                    <!-- Seat Number (readonly) -->
                    <div class="mb-3">
                        <label for="seatNumber" class="form-label">Seat Number</label>
                        <input type="text" class="form-control" id="seatNumber" th:value="*{seatNumber}" readonly/>
                    </div>
                    <!-- Passenger Full Name (readonly) -->
                    <div class="mb-3">
                        <label for="passengerFullName" class="form-label">Passenger Full Name</label>
                        <input type="text" class="form-control" id="passengerFullName" th:value="*{passengerFullName}" readonly/>
                    </div>
                    <!-- Ticket Price (editable) -->
                    <div class="mb-3">
                        <label for="ticketPrice" class="form-label">Ticket Price</label>
                        <input type="number" step="0.01" class="form-control" id="ticketPrice" th:field="*{ticketPrice}"/>
                    </div>
                    <!-- Status (editable) -->
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <input type="text" class="form-control" id="status" th:field="*{status}"/>
                    </div>
                    <div class="mb-3">
                        <a th:href="@{/staff/ticketManagement}" class="btn btn-secondary">Back</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
